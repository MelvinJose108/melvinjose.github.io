{% assign au = site.data.author %}{% if au.photo %}<img class="avatar photo {{ include.cls }}" src="{% if include.big %}{{ au.photo | relative_url }}{% else %}{{ au.photo_small | relative_url }}{% endif %}" alt="{{ au.name }}" width="{% if include.big %}160{% else %}64{% endif %}" height="{% if include.big %}160{% else %}64{% endif %}"{% unless include.eager %} loading="lazy"{% endunless %} decoding="async">{% else %}<div class="avatar {{ include.cls }}" aria-hidden="true">{{ au.initials }}</div>{% endif %}
