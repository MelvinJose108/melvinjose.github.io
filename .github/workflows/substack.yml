name: Sync Substack posts

on:
  schedule:
    - cron: "17 2 * * *"   # daily, 06:17 Dubai time
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Substack feed
        run: python3 scripts/fetch_substack.py
      - name: Commit and rebuild if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- _data/substack.yml; then echo "No new posts"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/substack.yml
          git commit -m "Sync Substack posts"
          git push
          # Pushes made with the workflow token don't always start a Pages build, so request one.
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
