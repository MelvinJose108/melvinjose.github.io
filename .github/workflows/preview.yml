name: preview build
on:
  push:
    branches: ['preview-*']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Push built site to preview-site branch
        run: |
          cd _site
          sudo chown -R "$(id -u)" .
          git init -q -b preview-site
          git config user.name preview-bot
          git config user.email preview-bot@users.noreply.github.com
          git add -A && git commit -qm "preview of ${GITHUB_SHA}"
          git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" preview-site
