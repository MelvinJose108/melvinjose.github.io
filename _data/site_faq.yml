- q: "Is the information on The UAE Ledger tax advice?"
  a: "No. The guides and tools are general information to help you understand the UAE rules. Your own position depends on your facts, so confirm with the Federal Tax Authority or a qualified adviser before acting."
- q: "Who writes the guides?"
  a: "Melvin Jose, a Senior Audit Executive in Ajman and Chartered Accountant finalist with 6+ years in audit and tax across the UAE and India. Every guide links to the official source it is based on."
- q: "How up to date are the guides?"
  a: "Each guide shows a 'Last reviewed' date under the title and is updated when the FTA or Ministry of Finance changes the rules it covers. If a rule has changed and a guide hasn't caught up, please flag it through the contact page."
- q: "Are the tools free, and is my data stored?"
  a: "All six tools are free and run entirely in your browser. Nothing you enter is sent to or stored on a server."
- q: "Can I ask a question about my own situation?"
  a: "Yes. Use the Ask a question page. Every message is read and answered personally, and common questions become new guides."
- q: "How do I get new guides when they're published?"
  a: "Subscribe to the newsletter for a short email when something new goes up, or follow by RSS from the Follow page."
