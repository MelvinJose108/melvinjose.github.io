<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script>document.documentElement.className='js';try{document.documentElement.dataset.theme=localStorage.getItem('t')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light')}catch(e){}</script>
{% seo %}
{% feed_meta %}
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%234F46E5'/%3E%3Cstop offset='1' stop-color='%230EA5E9'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Ctext x='50%25' y='53%25' dominant-baseline='central' text-anchor='middle' font-family='Arial' font-weight='700' font-size='15' fill='white'%3EUL%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
<div id="bar"></div>
<header class="top"><div class="wrap">
  <a class="brand" href="{{ '/' | relative_url }}"><i></i>{{ site.title | escape }}</a>
  <nav aria-label="Main">
    <a href="{{ '/' | relative_url }}">Latest</a>
    <a href="{{ '/guides/' | relative_url }}">Archive</a>
    <a href="{{ '/calculator/' | relative_url }}">Calculator</a>
    <a href="{{ '/about/' | relative_url }}">About</a>
    <button class="tt" id="tt" type="button" aria-label="Switch light or dark theme">◐</button>
  </nav>
</div></header>
<main class="wrap">
{{ content }}
</main>
<footer><div class="wrap">
  <p>Educational content only, not tax, legal or financial advice. Rules change, so confirm details with the Federal Tax Authority or a qualified adviser.</p>
  <p>© 2026 {{ site.author }} · <a href="{{ '/feed.xml' | relative_url }}">RSS</a></p>
</div></footer>
<script>
(function(){
var d=document,r=d.documentElement;
var tb=d.getElementById('tt');
if(tb)tb.addEventListener('click',function(){var t=r.dataset.theme==='dark'?'light':'dark';r.dataset.theme=t;try{localStorage.setItem('t',t)}catch(e){}});
var io='IntersectionObserver' in window?new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}})},{threshold:.1}):null;
d.querySelectorAll('.reveal').forEach(function(el){if(io)io.observe(el);else el.classList.add('in')});
var bar=d.getElementById('bar'),post=d.querySelector('.post .body');
if(bar&&post)addEventListener('scroll',function(){var h=post.offsetHeight-innerHeight*.5,y=scrollY-post.offsetTop+innerHeight*.3;bar.style.width=Math.max(0,Math.min(1,y/h))*100+'%'},{passive:true});
var q=d.getElementById('q'),cards=[].slice.call(d.querySelectorAll('.card')),f='all';
function ap(){var t=q?q.value.toLowerCase().trim():'',n=0;cards.forEach(function(c){var ok=(f==='all'||c.dataset.topic===f)&&c.dataset.text.indexOf(t)>-1;c.hidden=!ok;if(ok)n++});var m=d.getElementById('none');if(m)m.hidden=n>0}
if(q)q.addEventListener('input',ap);
d.querySelectorAll('[data-f]').forEach(function(b){b.addEventListener('click',function(){f=b.dataset.f;d.querySelectorAll('[data-f]').forEach(function(x){x.setAttribute('aria-pressed',x===b)});ap()})});
})();
</script>
</body>
</html>
